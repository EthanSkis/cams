name: Refresh cameras

on:
  schedule:
    - cron: "17 */6 * * *"    # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run scraper
        working-directory: scraper
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: node src/index.js
      - name: Commit updated cameras.json if changed
        run: |
          if [ -n "$(git status --porcelain assets/cameras.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/cameras.json
            git commit -m "refresh cameras data"
            git push
          else
            echo "cameras.json unchanged"
          fi
