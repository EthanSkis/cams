name: Refresh cameras.json

on:
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      # Add more KEY_* env vars here (via repo secrets) to unlock more state
      # DOT feeds. Sources whose key is unset are simply skipped.
      KEY_NPS:   ${{ secrets.KEY_NPS }}
      KEY_511NY: ${{ secrets.KEY_511NY }}
      KEY_511GA: ${{ secrets.KEY_511GA }}
      KEY_511VA: ${{ secrets.KEY_511VA }}
      KEY_511PA: ${{ secrets.KEY_511PA }}
      KEY_511FL: ${{ secrets.KEY_511FL }}
      KEY_WSDOT: ${{ secrets.KEY_WSDOT }}
      KEY_511TX: ${{ secrets.KEY_511TX }}
      KEY_511OH: ${{ secrets.KEY_511OH }}
      KEY_511OR: ${{ secrets.KEY_511OR }}
      KEY_511UT: ${{ secrets.KEY_511UT }}
      KEY_511MI: ${{ secrets.KEY_511MI }}
      KEY_511MN: ${{ secrets.KEY_511MN }}
      KEY_511MA: ${{ secrets.KEY_511MA }}
      KEY_511NJ: ${{ secrets.KEY_511NJ }}
      KEY_511IL: ${{ secrets.KEY_511IL }}
      KEY_511IN: ${{ secrets.KEY_511IN }}
      KEY_511AZ: ${{ secrets.KEY_511AZ }}
      KEY_511NC: ${{ secrets.KEY_511NC }}
      KEY_511TN: ${{ secrets.KEY_511TN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scraper
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund --silent
          node src/index.js
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet --exit-code assets/cameras.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit updated cameras.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "cams-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/cameras.json
          git commit -m "chore(data): refresh cameras.json"
          git push
